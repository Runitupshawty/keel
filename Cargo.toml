[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Runitupshawty/keel"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
portable-pty = "0.9"
vt100 = "0.16"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Ole", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_WindowsProgramming", "Win32_UI_WindowsAndMessaging"] }
libloading = "0.8"
nucleo = "0.5"
ignore = "0.4"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
pulldown-cmark = "0.12"
image = "0.25"
resvg = "0.44"
calamine = "0.26"
csv = "1"
pdfium-render = { version = "0.8", features = ["sync"] }
docx-rs = "0.4"
russh = "0.50"
russh-sftp = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-async-persistent", "crypto-rust", "async-io"] }
ssh-key = "0.6"
dirs = "6"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
# Archive codecs are pure Rust (cross-checks need no C toolchain); only unrar builds C++.
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "time"] }
sevenz-rust = "0.6"
tar = "0.4"
flate2 = "1"
bzip2 = { version = "0.5", default-features = false, features = ["libbz2-rs-sys"] }
lzma-rs = "0.3"
ruzstd = "0.8"
time = "0.3"
unrar = "0.5"
# Cloud (Phase 4): only the three services; TLS is rustls (no OpenSSL / native-tls).
opendal = { version = "0.59", default-features = false, features = ["services-gdrive", "services-dropbox", "services-s3", "executors-tokio", "blocking", "http-transport-reqwest-rustls-no-provider"] }
# opendal's facade only installs a transport with its own TLS provider: Keel installs this one
# (its reqwest client, timeouts, rustls + platform verifier) explicitly.
opendal-http-transport-reqwest = { version = "0.59.4", default-features = false, features = ["rustls-no-provider"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form"] }
# S3 keys go to opendal through a credential provider whose Debug output is redacted.
reqsign-core = { version = "3.3", default-features = false }
reqsign-aws-v4 = { version = "3.3", default-features = false }
# Pure-Rust TLS crypto (no C toolchain, so cross-target checks build), installed as
# rustls' process default on first cloud use.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
rustls-graviola = "0.4"
tiny_http = "0.12"
open = "5"
base64 = "0.22"
getrandom = "0.3"
url = "2"
serde_json = "1"
# Own NTFS indexer (keel-search, Windows): index db, query patterns, fallback watcher.
rusqlite = { version = "0.37", features = ["bundled"] }
regex = "1"
notify = "6"
directories = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
