name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Build daemon image
        run: docker build -t keel-daemon .
      - name: Check non-root runtime and daemon flags
        run: |
          test "$(docker run --rm --entrypoint id keel-daemon -u)" = 10001
          docker run --rm keel-daemon --help
      - name: Serve the embedded web client
        run: |
          docker run -d --name keel -p 127.0.0.1:7421:7421 -v keel-state:/var/lib/keel keel-daemon
          trap 'docker logs keel; docker rm -f keel; docker volume rm keel-state' EXIT
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 http://localhost:7421/ -o /tmp/index.html
          grep -q boot.js /tmp/index.html
          curl --fail http://localhost:7421/keel_web_bg.wasm -o /dev/null
          docker exec keel test -s /var/lib/keel/config/daemon.token
          docker cp keel:/var/lib/keel/config/daemon.token /tmp/keel-token
          docker stop keel
          test "$(docker inspect --format '{{.State.ExitCode}}' keel)" = 0
          docker start keel
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 http://localhost:7421/ -o /dev/null
          docker cp keel:/var/lib/keel/config/daemon.token /tmp/keel-token-after
          cmp /tmp/keel-token /tmp/keel-token-after

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system libraries
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # pdfium in target/deps: the tests that read PDFs (the preview, the text reader) skip
      # their PDF part without it.
      - name: Fetch runtime dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-deps.ps1
      - name: Fetch runtime dependencies (macOS, Linux)
        if: runner.os != 'Windows'
        run: bash scripts/fetch-deps.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 22
      - name: Generated TypeScript client checks
        if: runner.os == 'Linux'
        run: npm ci --prefix sdk/typescript && npm test --prefix sdk/typescript
      - name: Generated Swift client checks
        if: runner.os == 'macOS'
        run: sh sdk/swift/test.sh
      # The installers' checksum and signature checks, against temp files (no download).
      - name: Installer checks (install.sh)
        shell: bash
        run: bash scripts/test-install.sh
      - name: Installer checks (install.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1

  # The web client (crates/keel-web) for the browser: its UI and glue only build for wasm32.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - run: cargo build --locked -p keel-web --target wasm32-unknown-unknown
      - run: cargo clippy --locked -p keel-web --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo clippy --locked -p keel-web --target wasm32-unknown-unknown --all-targets --features e2e -- -D warnings
      # The release bundle the daemon embeds: wasm-bindgen-cli of the version in Cargo.lock,
      # then the service worker must carry the build's version.
      - name: wasm-bindgen-cli
        run: cargo install --locked wasm-bindgen-cli --version "$(cargo pkgid wasm-bindgen | sed 's/.*@//')"
      - run: bash scripts/build-web.sh
      - name: Service worker stamped
        run: grep -Eq 'const VERSION = "[0-9a-f]{16}";' crates/keel-web/dist/sw.js
      # The browser-test hook (`e2e` feature) is never in the release bundle.
      - name: No e2e hook in the release bundle
        run: "! grep -qa __keel crates/keel-web/dist/*"

  # The web client in a real browser: keel-daemon --web with a fixture library, driven by
  # Playwright (Chromium only; tests/web-e2e). Not part of `check`: it is the slowest job.
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web-e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The wasm job's bundle steps with the test hook (`e2e` feature: window.__keel with
      # ?e2e=1); keel-daemon embeds the bundle, so it builds after.
      - name: wasm-bindgen-cli
        run: cargo install --locked wasm-bindgen-cli --version "$(cargo pkgid wasm-bindgen | sed 's/.*@//')"
      - run: bash scripts/build-web.sh --features e2e
      - run: cargo build --locked -p keel-daemon
      # pdfium next to keel-daemon: the PDF preview flow expects a page image then.
      - run: bash scripts/fetch-deps.sh && cp target/deps/libpdfium.so target/debug/
      - name: Playwright
        working-directory: tests/web-e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - run: bash tests/web-e2e/run.sh
      - name: Screenshots and daemon log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e
          path: tests/web-e2e/out
          if-no-files-found: ignore

  # The mount backends (the `build` job keeps the default features): Linux builds keel-daemon
  # with `fuse`, as its release build does, and mounts for real (the round trip in
  # crates/keel-mount/tests, through fusermount3); Windows builds and lints it with `winfsp`
  # so a build from source keeps working (no release build ships it: winfsp-rs is GPL-3.0;
  # bindgen needs libclang; the WinFsp driver is only needed to mount).
  mount:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: fuse
          - os: windows-latest
            features: winfsp
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system libraries and FUSE
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev fuse3
          test -c /dev/fuse && which fusermount3
      - name: libclang for bindgen (WinFsp headers)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/libclang.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: mount-${{ matrix.features }}
      - run: cargo build --locked -p keel-daemon --features ${{ matrix.features }}
      - run: cargo clippy --locked -p keel-mount --features ${{ matrix.features }} --all-targets -- -D warnings
      # Linux only: a test binary with `winfsp` needs the WinFsp DLL to start (keel-daemon
      # delay-loads it; test binaries do not).
      - name: keel-mount tests with a real FUSE mount
        if: runner.os == 'Linux'
        env:
          KEEL_FUSE_TEST: 1
        run: cargo test --locked -p keel-mount --features fuse

  # Licenses, advisories, banned crates and sources; policy in deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  # libFuzzer (docs/fuzzing.md): every target in fuzz/ for 60 s, on pushes to main only. Not
  # part of `check`; the same targets run on their corpus in every `cargo test`.
  fuzz:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          key: fuzz
      # The other Linux jobs' packages (eframe, cpal), plus D-Bus for keyring's libdbus-sys.
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev libdbus-1-dev pkg-config
      - run: cargo install --locked cargo-fuzz
      - run: cargo +nightly fuzz build -a
      - name: Each target for 60 s
        run: |
          for t in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run -a "$t" "fuzz/corpus/$t" --               -max_total_time=60 -max_len=65536 -timeout=10 -rss_limit_mb=2048 -malloc_limit_mb=512
          done
      - name: Failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  # Pull requests only: flags newly added dependencies with known vulnerabilities or disallowed licenses.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4

  # The single required status check for branch protection.
  check:
    needs: [build, wasm, mount, deny, docker]
    runs-on: ubuntu-latest
    steps:
      - run: echo ok

  # Tag v* -> one archive per platform on the GitHub release. macOS x64 is cross-built on the
  # arm64 runner (no Intel runner needed); fetch-deps picks the matching pdfium via
  # KEEL_PDFIUM_ASSET. keel-daemon gets a mount backend on Linux only (`mount`: FUSE; none on
  # Windows, where winfsp-rs is GPL-3.0, or on macOS, where macFUSE cannot be installed on the
  # runner).
  package:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: win64
            libs: Everything64.dll pdfium.dll
            # Static CRT: keel.exe runs without the VC++ redistributable (VCRUNTIME140.dll).
            rustflags: -C target-feature=+crt-static
            # No mount backend: winfsp-rs is GPL-3.0 and the shipped daemon stays MIT/Apache.
            # Build keel-daemon with --features winfsp from source for WinFsp mounts.
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            pdfium: pdfium-mac-arm64
            libs: libpdfium.dylib
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
            pdfium: pdfium-mac-x64
            libs: libpdfium.dylib
          # Oldest supported glibc (2.35): the binary runs on Ubuntu 22.04 and Debian 12.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            pdfium: pdfium-linux-x64
            libs: libpdfium.so
            mount: fuse
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Fetch runtime dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-deps.ps1
      - name: Fetch runtime dependencies (macOS, Linux)
        if: runner.os != 'Windows'
        env:
          KEEL_PDFIUM_ASSET: ${{ matrix.pdfium }}
        run: bash scripts/fetch-deps.sh
      # keel-daemon embeds the web client, so the bundle is built first (the wasm job's steps).
      - name: wasm-bindgen-cli
        shell: bash
        run: cargo install --locked wasm-bindgen-cli --version "$(cargo pkgid wasm-bindgen | sed 's/.*@//')"
      - name: Web client bundle
        shell: bash
        run: bash scripts/build-web.sh
      # Two builds: one cargo run would unify keel-mount's features, compiling the mount
      # backend into keel as well.
      - name: Build release
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          cargo build --release --locked -p keel-app --target ${{ matrix.target }}
          cargo build --release --locked -p keel-daemon --target ${{ matrix.target }} ${{ matrix.mount && format('--features {0}', matrix.mount) || '' }}
      # Signing (docs/releasing.md): each step runs only when its secrets exist, and otherwise
      # says so in the log and leaves the build unsigned. KEEL_SIGNATURE records what was done
      # for the release job's summary.
      - name: Sign (Windows, Authenticode)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          BIN: target/${{ matrix.target }}/release
        run: |
          if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) {
            Write-Output '::notice::Windows signing skipped: WINDOWS_CERT_PFX_BASE64 and WINDOWS_CERT_PASSWORD are not set. The build is unsigned.'
            'KEEL_SIGNATURE=unsigned' | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            exit 0
          }
          # Our own binaries only; the shipped DLLs keep their vendors' state.
          $files = "$env:BIN/keel.exe", "$env:BIN/keel-daemon.exe"
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK' }
          $pfx = Join-Path $env:RUNNER_TEMP 'keel-sign.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:PFX_PASSWORD @files
            if ($LASTEXITCODE) { throw "signtool sign failed ($LASTEXITCODE)" }
            & $signtool.FullName verify /pa /v @files
            if ($LASTEXITCODE) { throw "signtool verify failed ($LASTEXITCODE)" }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
          $cert = (Get-AuthenticodeSignature $files[0]).SignerCertificate
          "KEEL_SIGNATURE=Authenticode, timestamped ($($cert.Subject); thumbprint $($cert.Thumbprint))" |
            Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      # Binaries in a tarball cannot be stapled: Gatekeeper looks the notarization ticket up
      # online at the first start instead.
      - name: Sign and notarize (macOS, Developer ID)
        if: runner.os == 'macOS'
        env:
          P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          BIN: target/${{ matrix.target }}/release
        run: |
          set -euo pipefail
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "::notice::macOS signing skipped: APPLE_CERT_P12_BASE64, APPLE_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD are not all set. The build is unsigned."
            echo "KEEL_SIGNATURE=unsigned" >> "$GITHUB_ENV"
            exit 0
          fi
          kc="$RUNNER_TEMP/keel-sign.keychain-db"; p12="$RUNNER_TEMP/keel-sign.p12"; zip="$RUNNER_TEMP/keel-notarize.zip"
          trap 'security delete-keychain "$kc" 2>/dev/null || true; rm -f "$p12" "$zip"' EXIT
          kcpw="$(openssl rand -hex 24)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # `|| true`: no match is the error below, not a silent exit at this line (pipefail).
          identity="$(security find-identity -v -p codesigning "$kc" | grep -o '"Developer ID Application: [^"]*"' | head -n1 | tr -d '"' || true)"
          [ -n "$identity" ] || { echo "::error::APPLE_CERT_P12_BASE64 holds no Developer ID Application identity"; exit 1; }
          # The dylib too: the hardened runtime only loads libraries signed by the same team.
          # The programs get assets/keel.entitlements (Apple Events, docs/releasing.md).
          files=("target/deps/libpdfium.dylib" "$BIN/keel" "$BIN/keel-daemon")
          codesign --force --options runtime --timestamp --keychain "$kc" --sign "$identity" "${files[0]}"
          codesign --force --options runtime --timestamp --keychain "$kc" --sign "$identity" --entitlements assets/keel.entitlements "${files[@]:1}"
          codesign --verify --strict --verbose=2 "${files[@]}"
          zip -j "$zip" "${files[@]}"
          # `|| true`: a refused or failed submission still prints Apple's answer and log below.
          out="$(xcrun notarytool submit "$zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --output-format json)" || true
          echo "$out"
          field() { printf '%s' "$out" | python3 -c "import json,sys
          try: print(json.load(sys.stdin).get('$1',''))
          except Exception: pass"; }
          status="$(field status)"
          if [ "$status" != Accepted ]; then
            id="$(field id)"
            [ -z "$id" ] || xcrun notarytool log "$id" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" || true
            echo "::error::notarization ended as '${status:-no answer}'"; exit 1
          fi
          echo "KEEL_SIGNATURE=Developer ID, notarized ($identity)" >> "$GITHUB_ENV"
      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          name="keel-${GITHUB_REF_NAME}-${{ matrix.name }}"
          bin="target/${{ matrix.target }}/release"
          exe=keel; daemon=keel-daemon
          if [ "$RUNNER_OS" = Windows ]; then exe=keel.exe; daemon=keel-daemon.exe; fi
          mkdir -p "dist/$name"
          # Both binaries, every runtime library and its license notices must be present: fail otherwise.
          for f in "$bin/$exe" "$bin/$daemon" $(printf 'target/deps/%s ' ${{ matrix.libs }}) target/deps/licenses/pdfium/LICENSE; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          if [ "$RUNNER_OS" = Windows ] && [ -z "$(ls -A target/deps/licenses/everything 2>/dev/null)" ]; then
            echo "::error::missing Everything SDK license notice"; exit 1
          fi
          cp "$bin/$exe" "$bin/$daemon" "dist/$name/"
          for lib in ${{ matrix.libs }}; do cp "target/deps/$lib" "dist/$name/"; done
          cp -R target/deps/licenses "dist/$name/licenses"
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY.md README.md CHANGELOG.md "dist/$name/"
          if [ "$RUNNER_OS" = Linux ]; then cp assets/keel.desktop assets/keel.png "dist/$name/"; fi
          # The installer itself, so SHA256SUMS covers it and an install updated from Keel's
          # banner gets this release's checks (install.ps1 keeps the zip's copy).
          if [ "$RUNNER_OS" = Windows ]; then cp scripts/install.ps1 "dist/$name/"; fi
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then 7z a -tzip "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
          # Debian/Ubuntu package from the same tree (dpkg-deb only, see scripts/make-deb.sh).
          if [ "$RUNNER_OS" = Linux ]; then bash ../scripts/make-deb.sh "$name" "$GITHUB_REF_NAME" .; fi
          # For the release job's summary, not a release asset. Linux binaries are not signed;
          # the release job's checksums line says whether SHA256SUMS.asc covers the downloads.
          echo "${{ matrix.name }}: ${KEEL_SIGNATURE:-binaries not signed}" > "signature-${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: keel-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/signature-*.txt
          if-no-files-found: error

  # One job creates the release, so parallel uploads cannot race on it.
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # One checksum file for every artifact; scripts/install.ps1 and install.sh verify against it.
      - name: Checksums
        run: cd dist && sha256sum -- *.zip *.tar.gz *.deb > SHA256SUMS && cat SHA256SUMS
      # A detached signature of SHA256SUMS plus the public key (install.sh checks it against
      # the fingerprint it pins), only when the key is a secret.
      - name: Sign checksums (GPG)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::notice::Checksum signing skipped: GPG_PRIVATE_KEY is not set. No SHA256SUMS.asc."
            echo "checksums: SHA256SUMS, not signed" > dist/signature-checksums.txt
            exit 0
          fi
          export GNUPGHOME="$(mktemp -d)"
          trap 'gpgconf --kill all || true; rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --armor --detach-sign --output dist/SHA256SUMS.asc dist/SHA256SUMS
          gpg --batch --verify dist/SHA256SUMS.asc dist/SHA256SUMS
          fpr="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr"{print $10; exit}')"
          gpg --batch --armor --export "$fpr" > dist/SHA256SUMS.key.asc
          echo "checksums: SHA256SUMS.asc, GPG key $fpr" > dist/signature-checksums.txt
      - name: Signatures made
        run: |
          { echo "### Signatures"; echo; sed 's/^/- /' dist/signature-*.txt; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          # v0.1.0-rc1 and other tags with a "-" publish as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS*
