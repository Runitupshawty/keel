name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system libraries
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo ok

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch runtime dependencies
        shell: pwsh
        run: |
          ./scripts/fetch-deps.ps1
          if (-not (Get-ChildItem target/deps -Filter 'pdfium*.dll')) { throw 'pdfium library missing from target/deps' }
      - name: Build release
        run: cargo build --release
      - name: Package release
        shell: pwsh
        run: Compress-Archive -Path target/release/keel.exe,target/release/*.dll,LICENSE-MIT,LICENSE-APACHE,THIRD_PARTY.md,target/deps/licenses -DestinationPath keel-${{ github.ref_name }}-win64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/keel.exe
            keel-${{ github.ref_name }}-win64.zip
