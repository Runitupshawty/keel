name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch runtime dependencies
        shell: pwsh
        run: ./scripts/fetch-deps.ps1
      - name: Build release
        run: cargo build --release
      - name: Package release
        shell: pwsh
        run: Compress-Archive -Path target/release/keel.exe,target/release/*.dll,LICENSE-MIT,LICENSE-APACHE,THIRD_PARTY.md,target/deps/licenses -DestinationPath keel-${{ github.ref_name }}-win64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/keel.exe
            keel-${{ github.ref_name }}-win64.zip
