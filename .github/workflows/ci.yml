name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system libraries
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  # The web client (crates/keel-web) for the browser: its UI and glue only build for wasm32.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - run: cargo build --locked -p keel-web --target wasm32-unknown-unknown
      - run: cargo clippy --locked -p keel-web --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo clippy --locked -p keel-web --target wasm32-unknown-unknown --all-targets --features e2e -- -D warnings
      # The release bundle the daemon embeds: wasm-bindgen-cli of the version in Cargo.lock,
      # then the service worker must carry the build's version.
      - name: wasm-bindgen-cli
        run: cargo install --locked wasm-bindgen-cli --version "$(cargo pkgid wasm-bindgen | sed 's/.*@//')"
      - run: bash scripts/build-web.sh
      - name: Service worker stamped
        run: grep -Eq 'const VERSION = "[0-9a-f]{16}";' crates/keel-web/dist/sw.js
      # The browser-test hook (`e2e` feature) is never in the release bundle.
      - name: No e2e hook in the release bundle
        run: "! grep -qa __keel crates/keel-web/dist/*"

  # The web client in a real browser: keel-daemon --web with a fixture library, driven by
  # Playwright (Chromium only; tests/web-e2e). Not part of `check`: it is the slowest job.
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web-e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The wasm job's bundle steps with the test hook (`e2e` feature: window.__keel with
      # ?e2e=1); keel-daemon embeds the bundle, so it builds after.
      - name: wasm-bindgen-cli
        run: cargo install --locked wasm-bindgen-cli --version "$(cargo pkgid wasm-bindgen | sed 's/.*@//')"
      - run: bash scripts/build-web.sh --features e2e
      - run: cargo build --locked -p keel-daemon
      - name: Playwright
        working-directory: tests/web-e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - run: bash tests/web-e2e/run.sh
      - name: Screenshots and daemon log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e
          path: tests/web-e2e/out
          if-no-files-found: ignore

  # The mount backends the release builds ship (the `build` job keeps the default features):
  # Linux builds keel-daemon with `fuse` and mounts for real (the round trip in
  # crates/keel-mount/tests, through fusermount3); Windows builds and lints it with `winfsp`
  # (bindgen needs libclang; the WinFsp driver is only needed to mount).
  mount:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: fuse
          - os: windows-latest
            features: winfsp
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system libraries and FUSE
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev fuse3
          test -c /dev/fuse && which fusermount3
      - name: libclang for bindgen (WinFsp headers)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/libclang.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: mount-${{ matrix.features }}
      - run: cargo build --locked -p keel-daemon --features ${{ matrix.features }}
      - run: cargo clippy --locked -p keel-mount --features ${{ matrix.features }} --all-targets -- -D warnings
      # Linux only: a test binary with `winfsp` needs the WinFsp DLL to start (keel-daemon
      # delay-loads it; test binaries do not).
      - name: keel-mount tests with a real FUSE mount
        if: runner.os == 'Linux'
        env:
          KEEL_FUSE_TEST: 1
        run: cargo test --locked -p keel-mount --features fuse

  # Licenses, advisories, banned crates and sources; policy in deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  # Pull requests only: flags newly added dependencies with known vulnerabilities or disallowed licenses.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4

  # The single required status check for branch protection.
  check:
    needs: [build, wasm, mount, deny]
    runs-on: ubuntu-latest
    steps:
      - run: echo ok

  # Tag v* -> one archive per platform on the GitHub release. macOS x64 is cross-built on the
  # arm64 runner (no Intel runner needed); fetch-deps picks the matching pdfium via
  # KEEL_PDFIUM_ASSET. keel-daemon gets the platform's mount backend (`mount`: WinFsp on
  # Windows, FUSE on Linux; none on macOS, where macFUSE cannot be installed on the runner).
  package:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: win64
            libs: Everything64.dll pdfium.dll
            # Static CRT: keel.exe runs without the VC++ redistributable (VCRUNTIME140.dll).
            rustflags: -C target-feature=+crt-static
            # No mount backend: winfsp-rs is GPL-3.0 and the shipped daemon stays MIT/Apache.
            # Build keel-daemon with --features winfsp from source for WinFsp mounts.
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            pdfium: pdfium-mac-arm64
            libs: libpdfium.dylib
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
            pdfium: pdfium-mac-x64
            libs: libpdfium.dylib
          # Oldest supported glibc (2.35): the binary runs on Ubuntu 22.04 and Debian 12.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            pdfium: pdfium-linux-x64
            libs: libpdfium.so
            mount: fuse
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev
      - name: libclang for bindgen (WinFsp headers)
        if: matrix.mount == 'winfsp'
        shell: pwsh
        run: ./scripts/libclang.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Fetch runtime dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-deps.ps1
      - name: Fetch runtime dependencies (macOS, Linux)
        if: runner.os != 'Windows'
        env:
          KEEL_PDFIUM_ASSET: ${{ matrix.pdfium }}
        run: bash scripts/fetch-deps.sh
      # keel-daemon embeds the web client, so the bundle is built first (the wasm job's steps).
      - name: wasm-bindgen-cli
        shell: bash
        run: cargo install --locked wasm-bindgen-cli --version "$(cargo pkgid wasm-bindgen | sed 's/.*@//')"
      - name: Web client bundle
        shell: bash
        run: bash scripts/build-web.sh
      # Two builds: one cargo run would unify keel-mount's features, compiling the mount
      # backend (and on Windows its GPL-3.0 code) into keel as well.
      - name: Build release
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          cargo build --release --locked -p keel-app --target ${{ matrix.target }}
          cargo build --release --locked -p keel-daemon --target ${{ matrix.target }} ${{ matrix.mount && format('--features {0}', matrix.mount) || '' }}
      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          name="keel-${GITHUB_REF_NAME}-${{ matrix.name }}"
          bin="target/${{ matrix.target }}/release"
          exe=keel; daemon=keel-daemon
          if [ "$RUNNER_OS" = Windows ]; then exe=keel.exe; daemon=keel-daemon.exe; fi
          mkdir -p "dist/$name"
          # Both binaries, every runtime library and its license notices must be present: fail otherwise.
          for f in "$bin/$exe" "$bin/$daemon" $(printf 'target/deps/%s ' ${{ matrix.libs }}) target/deps/licenses/pdfium/LICENSE; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          if [ "$RUNNER_OS" = Windows ] && [ -z "$(ls -A target/deps/licenses/everything 2>/dev/null)" ]; then
            echo "::error::missing Everything SDK license notice"; exit 1
          fi
          cp "$bin/$exe" "$bin/$daemon" "dist/$name/"
          for lib in ${{ matrix.libs }}; do cp "target/deps/$lib" "dist/$name/"; done
          cp -R target/deps/licenses "dist/$name/licenses"
          if [ "${{ matrix.mount }}" = winfsp ]; then
            # keel-daemon.exe links winfsp-rs (GPL-3.0): the license text goes with it.
            mkdir -p "dist/$name/licenses/winfsp-rs"
            cp assets/GPL-3.0.txt "dist/$name/licenses/winfsp-rs/COPYING"
          fi
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY.md README.md CHANGELOG.md "dist/$name/"
          if [ "$RUNNER_OS" = Linux ]; then cp assets/keel.desktop assets/keel.png "dist/$name/"; fi
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then 7z a -tzip "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
          # Debian/Ubuntu package from the same tree (dpkg-deb only, see scripts/make-deb.sh).
          if [ "$RUNNER_OS" = Linux ]; then bash ../scripts/make-deb.sh "$name" "$GITHUB_REF_NAME" .; fi
      - uses: actions/upload-artifact@v4
        with:
          name: keel-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  # One job creates the release, so parallel uploads cannot race on it.
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # One checksum file for every artifact; scripts/install.ps1 and install.sh verify against it.
      - name: Checksums
        run: cd dist && sha256sum -- *.zip *.tar.gz *.deb > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          # v0.1.0-rc1 and other tags with a "-" publish as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
