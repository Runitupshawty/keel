name: Diag

# Temporary (int2 only): runs the tests on Linux and macOS and prints the failing tests
# as annotations, since job logs need a login.
on:
  push:
    branches: [int2]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system libraries
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: diag
      - run: bash scripts/fetch-deps.sh
      - name: Tests
        run: cargo test --workspace 2>&1 | tee test.log
        continue-on-error: true
      - name: Tests again (no fail fast)
        run: cargo test --workspace --no-fail-fast 2>&1 | tee test2.log
        continue-on-error: true
      - name: Failing tests as annotations
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          t = open("test.log", errors="replace").read() + open("test2.log", errors="replace").read()
          out = []
          for m in re.finditer(r"---- (\S+) stdout ----\n(.*?)(?=\n---- |\nfailures:\n)", t, re.S):
              body = " | ".join(l for l in m.group(2).split("\n") if l.strip())[:700]
              out.append(m.group(1) + ": " + body)
          for m in re.finditer(r"^error(?:\[\w+\])?: .*$", t, re.M):
              out.append(m.group(0)[:300])
          for m in re.finditer(r"^test result: FAILED.*$", t, re.M):
              out.append(m.group(0)[:200])
          msg = "%0A".join(o.replace("%", "%25").replace("\r", "").replace("\n", "%0A") for o in out[:60])
          print("::error title=diag-tests::" + (msg or "no failures found"))
          PY
