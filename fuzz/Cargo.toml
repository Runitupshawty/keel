# libFuzzer targets (docs/fuzzing.md): `cargo +nightly fuzz run <target>` on Linux or macOS.
# Each target calls a `fuzz::` entry point of a crate (feature `fuzzing`); `cargo test` runs
# the same entry points on `corpus/<target>/` and seeded mutations of it.
[package]
name = "keel-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
keel-vfs = { path = "../crates/keel-vfs", features = ["fuzzing"] }
keel-core = { path = "../crates/keel-core", features = ["fuzzing"] }
keel-api = { path = "../crates/keel-api", features = ["fuzzing"] }
keel-net = { path = "../crates/keel-net", features = ["fuzzing"] }
keel-daemon = { path = "../crates/keel-daemon", features = ["fuzzing"] }
keel-preview = { path = "../crates/keel-preview", features = ["fuzzing"] }

# Not a member of the Keel workspace: it needs nightly and libFuzzer.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "archive"
path = "fuzz_targets/archive.rs"
test = false
doc = false
bench = false

