[package]
publish = false
name = "keel-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[features]
default = ["rar"]
rar = ["keel-vfs/rar"]

[[bin]]
name = "keel"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "persistence", "x11", "wayland"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["image", "svg", "file"] }
# Icon theme SVGs are checked with the parser usvg uses (egui_extras 0.31 -> usvg 0.37).
roxmltree = "0.19"
# rar (C++ via `cc`) is its own feature so cross-target checks can leave it out:
# `cargo check -p keel-app --target x86_64-unknown-linux-gnu --no-default-features`.
keel-vfs = { path = "../keel-vfs", default-features = false, features = ["zip", "sevenz", "tar", "cloud"] }
keel-search = { path = "../keel-search" }
keel-core = { path = "../keel-core" }
keel-api = { path = "../keel-api" }
keel-preview = { path = "../keel-preview" }
keel-term = { path = "../keel-term" }
keel-net = { path = "../keel-net" }
# The keel-net node's runtime; pairing QR codes (no image/svg renderers).
tokio.workspace = true
qrcode = { version = "0.14", default-features = false }
vt100.workspace = true
directories = "5"
open = "5"
humansize = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
natord = "1"
regex.workspace = true
# No http loader: Markdown previews must not fetch remote images.
egui_commonmark = { version = "0.20", default-features = false, features = ["pulldown_cmark"] }
ignore.workspace = true
serde_json = "1"
# Media view (Task 32): sidecar WebP decode, full-resolution viewer decode; the library's
# record content ids for sidecar keys (both already built for keel-core).
image.workspace = true
rusqlite.workspace = true
# Video playback in the viewer: sound output (ffmpeg decodes; it is not shipped).
cpal.workspace = true
# VS Code icon themes: .vsix packages (zip, sometimes gzip-wrapped by the Marketplace).
zip.workspace = true
flate2.workspace = true
# Wipes typed cloud secrets from memory (already in the tree through rustls / russh).
zeroize = "1"
# Folder picker (Extract to…) and SSH key file picker (Settings → Remotes); always called on
# a worker thread. GTK on Linux (eframe already needs libgtk-3-dev there).
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
clap = { version = "4.6.7", features = ["derive"] }
interprocess = "2.4.4"
global-hotkey = "0.8.0"

# Windows file clipboard lives in keel-vfs (CF_HDROP); elsewhere arboard's file list.
[target.'cfg(not(windows))'.dependencies]
arboard = { version = "3.6", default-features = false }

[dev-dependencies]
# tests/cli.rs: temp library folders, unique profile names.
tempfile = "3"
# backend tests: a keel-daemon in the test process for the window to attach to.
keel-daemon = { path = "../keel-daemon" }
getrandom.workspace = true
# The real cloud provider over an in-memory service in the job tests.
opendal = { workspace = true, features = ["services-memory"] }
egui_kittest = { version = "0.31", features = ["wgpu", "snapshot", "eframe"] }
# examples/gen_icon.rs: assets/keel.svg -> keel.png + keel.ico (image is a dependency)
resvg.workspace = true

# Icon + manifest resource, linked only when the target is Windows (checked in build.rs).
[build-dependencies]
embed-resource = "3"
