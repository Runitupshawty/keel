[package]
name = "keel-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "keel"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
windows.workspace = true
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["image", "svg", "file"] }

[dev-dependencies]
egui_kittest = { version = "0.31", features = ["wgpu", "snapshot", "eframe"] }
