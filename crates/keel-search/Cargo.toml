[package]
publish = false
name = "keel-search"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
# Daily rescans at a local time (already in the tree).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories.workspace = true
ignore.workspace = true
keel-vfs = { path = "../keel-vfs", default-features = false }
notify.workspace = true
nucleo.workspace = true
parking_lot.workspace = true
# Regex name patterns for the home-folder walk and the persistent name index.
regex = "1"
rusqlite.workspace = true
# Settings → Search is saved in the profile's config.toml.
serde.workspace = true

[dev-dependencies]
# The in-tree fuzz runs' harness (`keel_vfs::fuzz_harness`).
keel-vfs = { path = "../keel-vfs", default-features = false, features = ["test-util"] }
toml.workspace = true

[target.'cfg(windows)'.dependencies]
libloading.workspace = true
windows = { workspace = true, features = ["Win32_Security", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading"] }

[features]
# `fuzz::*`, the entry points of the libFuzzer targets in `fuzz/` (docs/fuzzing.md).
fuzzing = []
