[package]
publish = false
name = "keel-search"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
directories.workspace = true
ignore.workspace = true
keel-vfs = { path = "../keel-vfs", default-features = false }
notify.workspace = true
nucleo.workspace = true
parking_lot.workspace = true
# Regex name patterns for the home-folder walk and the persistent name index.
regex = "1"
rusqlite.workspace = true
# The ETP client (`etp`): TLS through keel-vfs's FTPS connector, which implements
# suppaftp's TLS traits (already in the tree through keel-vfs).
suppaftp = { version = "12", default-features = false, features = ["secure"] }

[target.'cfg(windows)'.dependencies]
libloading.workspace = true
windows = { workspace = true, features = ["Win32_Security", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading"] }
