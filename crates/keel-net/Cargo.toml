[package]
publish = false
name = "keel-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_bytes = "0.11"
blake3.workspace = true
tokio.workspace = true
tracing.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
rusqlite.workspace = true
sha2.workspace = true
hmac.workspace = true
getrandom.workspace = true
rustls = { workspace = true, features = ["ring"] }
keel-vfs = { path = "../keel-vfs", default-features = false, features = ["cloud"] }
keel-core = { path = "../keel-core" }
tempfile = "3"
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = "0.6"
async-trait = "0.1"
ciborium = "0.2"
data-encoding = "2"
tokio-util = { version = "0.7", features = ["rt"] }
fs4 = "0.13"

# Spacedrop staging folders are hidden in Explorer too.
[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
# MemoryProvider: a remote source in the device-write tests.
keel-vfs = { path = "../keel-vfs", default-features = false, features = ["cloud", "test-util"] }
rustls-graviola.workspace = true
