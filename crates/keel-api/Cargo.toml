[package]
name = "keel-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Keel's typed operation registry: one list for JSON-RPC, the CLI and MCP"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
getrandom.workspace = true
blake3.workspace = true
tokio.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true
toml.workspace = true
directories.workspace = true
keel-core = { path = "../keel-core" }
keel-vfs = { path = "../keel-vfs", default-features = false, features = ["cloud"] }
keel-net = { path = "../keel-net" }
schemars = "1.2"
async-trait = "0.1"
interprocess = "2.4.4"

# The daemon socket: the user's uid for the socket folder and peer checks.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The daemon pipe's security descriptor (SDDL) for interprocess.
[target.'cfg(windows)'.dependencies]
widestring = "1"

[dev-dependencies]
tempfile = "3"
jsonschema = { version = "0.58", default-features = false }
