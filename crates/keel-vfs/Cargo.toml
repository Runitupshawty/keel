[package]
name = "keel-vfs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["zip", "sevenz", "tar", "rar"]
zip = ["dep:zip", "dep:chrono"]
sevenz = ["dep:sevenz-rust"]
tar = ["dep:tar", "dep:flate2", "dep:bzip2", "dep:lzma-rs", "dep:ruzstd"]
# libunrar is C++ built with `cc`; cross-target checks from Windows build without it.
rar = ["dep:unrar_sys"]

[dependencies]
zip = { workspace = true, optional = true }
# Zip timestamps are local wall-clock time.
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
sevenz-rust = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
bzip2 = { workspace = true, optional = true }
lzma-rs = { workspace = true, optional = true }
ruzstd = { workspace = true, optional = true }
unrar_sys = { version = "0.5", optional = true }
tempfile = "3"
fs4 = "0.13"
directories = "5"
anyhow.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
russh.workspace = true
russh-sftp.workspace = true
tokio.workspace = true
keyring.workspace = true
ssh-key.workspace = true
dirs.workspace = true
sha2.workspace = true
hmac.workspace = true
sha1.workspace = true
opendal.workspace = true
opendal-http-transport-reqwest.workspace = true
reqwest.workspace = true
tiny_http.workspace = true
rustls.workspace = true
rustls-graviola.workspace = true
open.workspace = true
base64.workspace = true
getrandom.workspace = true
url.workspace = true
serde_json.workspace = true
toml.workspace = true
notify = "6"
notify-debouncer-mini = "0.4"
natord = "1"
rayon = "1"
walkdir = "2"
same-file = "1"
trash = "5"
sysinfo = { version = "0.32", default-features = false, features = ["disk"] }

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
opendal = { workspace = true, features = ["services-memory"] }
