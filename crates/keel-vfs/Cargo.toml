[package]
name = "keel-vfs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["zip", "sevenz", "tar", "rar"]
zip = ["dep:zip", "dep:time"]
sevenz = ["dep:sevenz-rust"]
tar = ["dep:tar", "dep:flate2", "dep:bzip2", "dep:lzma-rs", "dep:ruzstd"]
# unrar compiles C++ with `cc`; cross-target checks from Windows build without it.
rar = ["dep:unrar"]

[dependencies]
zip = { workspace = true, optional = true }
time = { workspace = true, optional = true }
sevenz-rust = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
bzip2 = { workspace = true, optional = true }
lzma-rs = { workspace = true, optional = true }
ruzstd = { workspace = true, optional = true }
unrar = { workspace = true, optional = true }
tempfile = "3"
directories = "5"
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
notify = "6"
notify-debouncer-mini = "0.4"
natord = "1"
rayon = "1"
walkdir = "2"
same-file = "1"
trash = "5"
sysinfo = { version = "0.32", default-features = false, features = ["disk"] }

[target.'cfg(windows)'.dependencies]
windows.workspace = true
