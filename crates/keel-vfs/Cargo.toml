[package]
publish = false
name = "keel-vfs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["zip", "sevenz", "tar", "rar", "cloud"]
zip = ["dep:zip", "dep:chrono", "dep:flate2"]
sevenz = ["dep:sevenz-rust2", "sevenz-rust2/compress", "sevenz-rust2/util"]
tar = ["dep:tar", "dep:flate2", "dep:bzip2", "dep:lzma-rs", "dep:ruzstd"]
# libunrar is C++ built with `cc`; cross-target checks from Windows build without it.
rar = ["dep:unrar_sys"]
# `memory::MemoryProvider`, an in-memory provider for other crates' tests.
test-util = []
# Google Drive, Dropbox and S3 (`cloud::`): opendal, reqwest, rustls + graviola, the OAuth
# loopback listener and the browser hand-off.
cloud = [
    "dep:opendal",
    "dep:opendal-http-transport-reqwest",
    "dep:reqwest",
    "dep:reqsign-core",
    "dep:reqsign-aws-v4",
    "dep:tiny_http",
    "dep:rustls",
    "dep:rustls-graviola",
    "dep:open",
    "dep:base64",
    "dep:getrandom",
    "dep:url",
    "dep:serde_json",
]

[dependencies]
zip = { workspace = true, optional = true }
# Zip timestamps are local wall-clock time.
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
sevenz-rust2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
bzip2 = { workspace = true, optional = true }
lzma-rs = { workspace = true, optional = true }
ruzstd = { workspace = true, optional = true }
unrar_sys = { version = "0.5", optional = true }
tempfile = "3"
fs4 = "0.13"
directories = "5"
anyhow.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
russh.workspace = true
russh-sftp.workspace = true
tokio.workspace = true
keyring.workspace = true
ssh-key.workspace = true
dirs.workspace = true
sha2.workspace = true
hmac.workspace = true
sha1.workspace = true
opendal = { workspace = true, optional = true }
opendal-http-transport-reqwest = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
reqsign-core = { workspace = true, optional = true }
reqsign-aws-v4 = { workspace = true, optional = true }
tiny_http = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-graviola = { workspace = true, optional = true }
open = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
url = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
toml.workspace = true
notify = "6"
notify-debouncer-mini = "0.4"
natord = "1"
rayon = "1"
walkdir = "2"
same-file = "1"
trash = "5"
sysinfo = { version = "0.32", default-features = false, features = ["disk"] }

[target.'cfg(windows)'.dependencies]
# Task 24 adds the COM `implement` support (drag_out's IDataObject / IDropSource) and the
# input / console / window helpers in `desktop`; `pipe` (single instance) the security ones.
windows = { workspace = true, features = [
    "implement",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_IO",
    # Task 33: the physical disk behind a volume (failure domains).
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }
windows-core = "0.58"

# Copy-on-write fast path for local copies on macOS/Linux.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(not(windows))'.dependencies]
reflink-copy = "0.1"

[dev-dependencies]
# Host keys for the in-process SSH server in the SFTP tests (same rand as russh).
rand = "0.10"
# Builds 7z fixtures in the archive tests.
sevenz-rust2 = { workspace = true, features = ["compress", "util", "aes256"] }
opendal = { workspace = true, features = ["services-memory"] }
# Fake HTTP services in the cloud tests.
http = "1"
