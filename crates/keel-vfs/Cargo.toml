[package]
publish = false
name = "keel-vfs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["zip", "sevenz", "tar", "rar", "cloud"]
zip = ["dep:zip"]
sevenz = ["dep:sevenz-rust2", "sevenz-rust2/compress", "sevenz-rust2/util"]
tar = ["dep:tar", "dep:bzip2", "dep:lzma-rs", "dep:ruzstd"]
# libunrar is C++ built with `cc`; cross-target checks from Windows build without it.
rar = ["dep:unrar_sys"]
# `memory::MemoryProvider`, an in-memory provider for other crates' tests.
test-util = []
# `fuzz::*`, the entry points of the libFuzzer targets in `fuzz/`.
fuzzing = []
# Google Drive, Dropbox and S3 (`cloud::`): opendal, reqwest, rustls + graviola, the OAuth
# loopback listener and the browser hand-off.
cloud = [
    "dep:opendal",
    "dep:opendal-http-transport-reqwest",
    "dep:reqwest",
    "dep:reqsign-core",
    "dep:reqsign-aws-v4",
    "dep:tiny_http",
    "dep:open",
    "dep:base64",
    "dep:getrandom",
    "dep:url",
    "dep:http",
]

[dependencies]
zip = { workspace = true, optional = true }
# Zip timestamps are local wall-clock time; FTP listings' dates.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sevenz-rust2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
# Gzip for zip/tar entries and disk usage scan files (`du`).
flate2.workspace = true
bzip2 = { workspace = true, optional = true }
lzma-rs = { workspace = true, optional = true }
ruzstd = { workspace = true, optional = true }
unrar_sys = { version = "0.5", optional = true }
tempfile = "3"
fs4 = "0.13"
directories = "5"
anyhow.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
russh.workspace = true
russh-sftp.workspace = true
tokio.workspace = true
keyring.workspace = true
ssh-key.workspace = true
dirs.workspace = true
sha2.workspace = true
# Disk usage duplicates (`du::duplicates`): BLAKE3 (the library's), xxHash3 (already in the
# tree through ruzstd), SHA-256.
blake3.workspace = true
twox-hash = { version = "2", default-features = false, features = ["std", "xxhash3_128"] }
hmac.workspace = true
sha1.workspace = true
opendal = { workspace = true, optional = true }
opendal-http-transport-reqwest = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
reqsign-core = { workspace = true, optional = true }
reqsign-aws-v4 = { workspace = true, optional = true }
tiny_http = { workspace = true, optional = true }
# TLS for the cloud services and FTPS: rustls with graviola's pure-Rust crypto.
rustls.workspace = true
rustls-graviola.workspace = true
# FTPS certificates are checked against the OS trust store (already used through reqwest).
rustls-platform-verifier = "0.7"
# FTP and FTPS remotes (`ftp::`): the blocking client only; TLS through Keel's own rustls
# connector (`secure`), implicit FTPS (`deprecated`). No OpenSSL, no ring / aws-lc-rs.
suppaftp = { version = "12", default-features = false, features = ["secure", "deprecated"] }
open = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
url = { workspace = true, optional = true }
serde_json.workspace = true
# Requests of chunked uploads (signed by reqsign, sent by reqwest).
http = { version = "1", optional = true }
toml.workspace = true
notify = "6"
notify-debouncer-mini = "0.4"
natord = "1"
rayon = "1"
# Disk usage scans (`du`): the path filter.
regex.workspace = true
walkdir = "2"
same-file = "1"
trash = "5"
sysinfo = { version = "0.32", default-features = false, features = ["disk"] }

[target.'cfg(windows)'.dependencies]
# Task 24 adds the COM `implement` support (drag_out's IDataObject / IDropSource) and the
# input / console / window helpers in `desktop`; `pipe` (single instance) the security ones.
windows = { workspace = true, features = [
    "implement",
    # Task 81: portable devices (phones, cameras) as disk usage scan roots.
    "Win32_Devices_PortableDevices",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_IO",
    # Task 33: the physical disk behind a volume (failure domains).
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    # Task 43: the shell context menu (PIDLs).
    "Win32_UI_Shell_Common",
    # Task 85: restores create their file relative to the checked folder's handle
    # (NtCreateFile) and refuse a virtual disk whose file is on the source volume.
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Storage_Vhd",
] }
windows-core = "0.58"

# Copy-on-write fast path for local copies on macOS/Linux.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(not(windows))'.dependencies]
reflink-copy = "0.1"

# Trashing through NSFileManager keeps the item's URL in the Trash (undo puts it back);
# the same version the `trash` crate uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSError", "NSFileManager", "NSGeometry", "NSString", "NSURL"] }
# Drag-out (`drag_out::mac`): a dragging session on Keel's window; the versions arboard,
# rfd and trash already use (winit is on objc2 0.5 / objc2-app-kit 0.2).
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSEvent",
    "NSImage",
    "NSPasteboard",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }

# Drag-out over XDND (`drag_out::x11`); pure Rust, already in the tree through winit.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[dev-dependencies]
# Host keys for the in-process SSH server in the SFTP tests (same rand as russh).
rand = "0.10"
# Builds 7z fixtures in the archive tests.
sevenz-rust2 = { workspace = true, features = ["compress", "util", "aes256"] }
opendal = { workspace = true, features = ["services-memory"] }
# Fake HTTP services in the cloud tests.
http = "1"
