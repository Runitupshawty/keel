[package]
publish = false
name = "keel-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[features]
test-hooks = []
# `fuzz::*`, the entry points of the libFuzzer targets in `fuzz/`.
fuzzing = ["dep:tempfile"]
# `probes::*`, crafted files for tests (keel-api's and this crate's).
probes = []

[dependencies]
syntect.workspace = true
pulldown-cmark.workspace = true
image.workspace = true
resvg.workspace = true
calamine.workspace = true
csv.workspace = true
pdfium-render.workspace = true
docx-rs.workspace = true
zip.workspace = true
quick-xml.workspace = true
keel-vfs = { path = "../keel-vfs", default-features = false }
# HEIC, HEIF and AVIF through ffmpeg (keel-core's media module decodes them).
keel-core = { path = "../keel-core", default-features = false }
# ffprobe's JSON (audio files).
serde_json.workspace = true
# Font samples: egui's rasterizer and the font parser under it (both already built for egui).
ab_glyph = "0.2"
ttf-parser = "0.25"
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
wait-timeout = "0.2"
# Legacy (Windows-1252) text files.
encoding_rs = "0.8"
tempfile = { version = "3", optional = true }

[dev-dependencies]
# The probes in this crate's own integration tests.
keel-preview = { path = ".", features = ["probes"] }
tempfile = "3"
# egui's bundled fonts, as font preview fixtures.
epaint_default_fonts = "0.31"
keel-vfs = { path = "../keel-vfs", default-features = false, features = ["test-util"] }
