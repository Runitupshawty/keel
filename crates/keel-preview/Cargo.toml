[package]
publish = false
name = "keel-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[features]
test-hooks = []
# `fuzz::*`, the entry points of the libFuzzer targets in `fuzz/`.
fuzzing = ["dep:tempfile"]

[dependencies]
syntect.workspace = true
pulldown-cmark.workspace = true
image.workspace = true
resvg.workspace = true
calamine.workspace = true
csv.workspace = true
pdfium-render.workspace = true
docx-rs.workspace = true
zip.workspace = true
quick-xml.workspace = true
keel-vfs = { path = "../keel-vfs", default-features = false }
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
wait-timeout = "0.2"
# Legacy (Windows-1252) text files.
encoding_rs = "0.8"
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"
keel-vfs = { path = "../keel-vfs", default-features = false, features = ["test-util"] }
